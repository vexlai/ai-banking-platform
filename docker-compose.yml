# Local multi-container deployment: FastAPI gateway (:8000) + Streamlit UI (:8501).
# The UI reaches the gateway over the compose network via API_BASE_URL.

services:
  api_gateway:
    build:
      context: .
    image: ai-banking-platform:local
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    environment:
      USE_MOCKS: "${USE_MOCKS:-false}"
      USE_LLM: "${USE_LLM:-false}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-gpt-4o-mini}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
      LLM_REASONING_EFFORT: "${LLM_REASONING_EFFORT:-}"
      API_KEY_REQUIRED: "${API_KEY_REQUIRED:-false}"
      API_KEY: "${API_KEY:-}"
      SERVING_DATA_DIR: "/app/data/serving"
      CORS_ALLOW_ORIGINS: "${CORS_ALLOW_ORIGINS:-*}"
    volumes:
      - ./data/serving:/app/data/serving:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  streamlit_ui:
    build:
      context: .
    image: ai-banking-platform:local
    command: streamlit run apps/demo_ui/app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      API_BASE_URL: http://api_gateway:8000
      API_KEY: "${API_KEY:-}"
      USE_MOCKS: "${USE_MOCKS:-false}"
    ports:
      - "8501:8501"
    depends_on:
      api_gateway:
        condition: service_healthy
    restart: unless-stopped