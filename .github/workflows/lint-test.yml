name: Lint Test Evals

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    env:
      USE_LLM: 'false'
      USE_MOCKS: 'true'

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff mypy

    - name: Run Ruff Linter
      # Keep imported, hash-locked analytics out of automatic formatting.
      run: ruff check api apps contracts evals src/orchestrator src/policy src/telemetry src/tools src/data src/retrieval tests/test_api.py tests/test_guardrails.py tests/test_orchestrator_engine.py tests/test_policy.py tests/conftest.py

    - name: Run Ruff Format Check
      run: ruff format --check api apps contracts evals src/orchestrator src/policy src/telemetry src/tools src/data src/retrieval tests/test_api.py tests/test_guardrails.py tests/test_orchestrator_engine.py tests/test_policy.py tests/conftest.py

    - name: Run Pytest Suite
      run: pytest tests/test_api.py tests/test_guardrails.py tests/test_orchestrator_engine.py tests/test_policy.py

    - name: Run Golden Set Evaluations
      run: python evals/run_eval.py

    - name: Check deterministic case core (no LLM)
      run: |
        ruff check src/cases tests/test_case_runtime.py scripts/demo_dispute_cases.py
        ruff format --check src/cases tests/test_case_runtime.py scripts/demo_dispute_cases.py
        pytest tests/test_case_runtime.py -q
        python scripts/demo_dispute_cases.py
        python scripts/demo_dispute_cases.py
    - name: Check secure application adapter (fixtures, no LLM)
      run: |
        ruff check tests/test_dispute_api.py scripts/smoke_dispute_http.py scripts/verify_dispute_adapter_regressions.py
        ruff format --check tests/test_dispute_api.py scripts/smoke_dispute_http.py scripts/verify_dispute_adapter_regressions.py
        pytest tests/test_dispute_api.py -q
        python scripts/smoke_dispute_http.py

  analytics-integrity:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements-analytics.txt
    - run: python -m pip install -r requirements-analytics.txt
    - name: Verify frozen outputs without raw data or model calls
      run: python scripts/verify_analytics_integration.py
    - name: Run offline analytical unit tests
      run: |
        python -m unittest discover -s tests -p 'test_intake_evaluation.py'
        python -m unittest discover -s tests -p 'test_profiling.py'
        python -m unittest discover -s tests -p 'test_dispute_addendum.py'
        python -m unittest discover -s tests -p 'test_dispute_workflow.py'
